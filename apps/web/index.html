<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A console for guarded, evidence-led investor research agents."
    />
    <title>Investor Research Console</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Agent research workspace</p>
        <h1>Investigate the thesis.<br />Challenge the assumptions.</h1>
        <p class="lede">
          Coordinate bounded research agents while preserving sources,
          disagreement, and uncertainty.
        </p>
      </header>

      <section class="workspace" aria-label="Research workspace">
        <form id="research-form">
          <label for="query">Research task</label>
          <textarea
            id="query"
            name="query"
            rows="7"
            required
            placeholder="Assess the durable advantages, capital allocation, and major risks..."
          ></textarea>
          <div class="controls">
            <label for="agent">Lead agent</label>
            <select id="agent" name="agent"></select>
            <button type="submit">Run research</button>
          </div>
          <p class="notice">Research output is not personal financial advice.</p>
        </form>

        <article id="result" aria-live="polite">
          <p class="empty">A traceable research report will appear here.</p>
        </article>
      </section>
    </main>
  </body>
</html>
