[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investor"
version = "0.1.0"
description = "Stock research tools inspired by Benjamin Graham's The Intelligent Investor"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
investor = "investor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
